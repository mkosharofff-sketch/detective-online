<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дело // Online</title><style>
:root{--bg:#0c1210;--panel:#15201d;--panel2:#1c2a26;--line:#30443e;--text:#edf4f1;--muted:#a3b5af;--a:#61d0bd;--danger:#e4788d;--warn:#e1af6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:66px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0a100e}.brand{font-weight:900;letter-spacing:.05em}.online{color:var(--a);font-size:13px}.landing{max-width:1180px;margin:auto;padding:70px 5vw;display:grid;grid-template-columns:1fr 430px;gap:60px}.eyebrow,.label{color:var(--a);font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.landing h1{font-size:clamp(42px,6vw,72px);line-height:.98;margin:18px 0;max-width:600px}.muted{color:var(--muted);line-height:1.55}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0d1512;padding:6px;border-radius:13px;margin-bottom:18px}.tabs button,.nav button{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:12px;font-weight:700}.tabs button.active,.nav button.active{background:var(--panel2);color:var(--text)}.form{display:none}.form.active{display:block}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.06em;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#0e1714;color:var(--text);padding:12px}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800}.primary{background:var(--a);color:#06221d}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:var(--danger);color:#26070d}.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 66px)}aside{padding:18px;border-right:1px solid var(--line);background:#101815}.code{font-size:26px;letter-spacing:.12em;font-weight:900;margin:7px 0 14px}.nav{display:grid;gap:5px;margin-top:18px}.nav button{text-align:left}.main{padding:28px;max-width:1100px;width:100%;margin:auto}.head{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:32px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.chars{display:grid;grid-template-columns:180px 1fr;gap:15px}.charlist{display:grid;gap:7px}.charlist button{text-align:left}.notice{padding:14px;border-radius:12px;background:#403022;color:#f5debf;margin-bottom:15px}.facts{display:grid;gap:10px}.fact{display:flex;gap:10px;align-items:center}.fact input{flex:1}.player{padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:9px;display:flex;justify-content:space-between;gap:12px}.role{color:var(--a);font-size:12px;text-transform:uppercase;font-weight:800}.waiting{max-width:600px;margin:13vh auto;padding:36px;text-align:center}.callgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.call{padding:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;text-align:left}.call:hover{border-color:var(--a)}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:12px;display:none;max-width:400px}.toast.show{display:block}@media(max-width:800px){.landing,.shell,.grid2,.chars{grid-template-columns:1fr}.landing{padding-top:35px;gap:28px}.shell aside{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:18px}.callgrid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand">ДЕЛО // ONLINE</div><div id="status" class="online">Подключение…</div></header><div id="app"></div><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{getDatabase,ref,get,set,update,onValue,runTransaction}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const cfg={apiKey:'AIzaSyCxpowPqAwwtEVzxdyk1nVAzZ2HJKSJH1Q',authDomain:'delo-1b821.firebaseapp.com',databaseURL:'https://delo-1b821-default-rtdb.europe-west1.firebasedatabase.app',projectId:'delo-1b821',storageBucket:'delo-1b821.firebasestorage.app',messagingSenderId:'438900845008',appId:'1:438900845008:web:e308c6cf469f53593231d5'};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);let me,room,code,tab='case',editChar=0,unsub;
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(x){$('toast').textContent=x;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),3500)}function gen(){let s='',a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}function defaults(name,max){return{hostUid:me.uid,maxPlayers:max,phase:'setup',createdAt:Date.now(),detectiveUid:null,players:{[me.uid]:{uid:me.uid,name,role:'host',joinedAt:Date.now()}},caseData:{title:'Новое дело',victim:'',incident:'',intro:'',location:''},characters:[{name:'Подозреваемый 1',occupation:'',archetype:'',relation:'',secret:'',goal:''},{name:'Подозреваемый 2',occupation:'',archetype:'',relation:'',secret:'',goal:''},{name:'Подозреваемый 3',occupation:'',archetype:'',relation:'',secret:'',goal:''}],truth:{killer:0,motive:'',method:'',chronology:'',facts:['','','','','','']},revealed:{},activeInterrogation:null,accusation:null}}async function authgo(){if(auth.currentUser)return auth.currentUser;return(await signInAnonymously(auth)).user}function landing(){ $('app').innerHTML=`<main class="landing"><section><div class="eyebrow">Устный детектив для Discord</div><h1>Создай дело. Запусти расследование.</h1><p class="muted">Ведущий создаёт комнату и сразу готовит дело. Детектив подключается позднее по коду. Дополнительные игроки могут зайти в любой момент.</p></section><section class="panel"><div class="tabs"><button class="active" data-t="host">Я ведущий</button><button data-t="detective">Я детектив</button><button data-t="player">Я игрок</button></div><div id="f-host" class="form active"><div class="field"><label>Имя ведущего</label><input id="hn" placeholder="Дмитрий"></div><div class="field"><label>Игроков без ведущего</label><select id="hm"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></div><button id="create" class="btn primary">Создать дело</button></div><div id="f-detective" class="form"><div class="field"><label>Имя детектива</label><input id="dn"></div><div class="field"><label>Код комнаты</label><input id="dc"></div><button id="jd" class="btn primary">Войти как детектив</button></div><div id="f-player" class="form"><div class="field"><label>Имя игрока</label><input id="pn"></div><div class="field"><label>Код комнаты</label><input id="pc"></div><button id="jp" class="btn primary">Войти как игрок</button></div></section></main>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));$('f-'+b.dataset.t).classList.add('active')});$('create').onclick=create;$('jd').onclick=()=>join('detective');$('jp').onclick=()=>join('player')}
async function create(){let n=$('hn').value.trim(),m=+$('hm').value;if(!n)return toast('Введи имя ведущего.');await authgo();for(let i=0;i<10;i++){code=gen();if(!(await get(ref(db,'rooms/'+code))).exists())break}await set(ref(db,'rooms/'+code),defaults(n,m));subscribe();tab='case';render()}
async function join(role){let n=$(role==='detective'?'dn':'pn').value.trim(),c=$(role==='detective'?'dc':'pc').value.trim().toUpperCase();if(!n||!c)return toast('Введи имя и код комнаты.');await authgo();let rr=ref(db,'rooms/'+c),s=await get(rr);if(!s.exists())return toast('Комната не найдена.');if(role==='detective'){let r=await runTransaction(ref(db,'rooms/'+c+'/detectiveUid'),v=>v===null?me.uid:undefined);if(!r.committed)return toast('Детектив уже занят.')}await update(ref(db,'rooms/'+c+'/players/'+me.uid),{uid:me.uid,name:n,role,joinedAt:Date.now()});code=c;subscribe();render()}
function subscribe(){unsub?.();unsub=onValue(ref(db,'rooms/'+code),s=>{room=s.val();if(room)render()})}function isHost(){return room?.hostUid===me?.uid}function save(path,v){return update(ref(db,'rooms/'+code+'/'+path),v)}function nav(){return `<aside><div class="label">Код комнаты</div><div class="code">${code}</div><button id="copy" class="btn secondary">Скопировать код</button><nav class="nav">${[['case','Дело'],['characters','Персонажи'],['truth','Истина'],['lobby','Лобби'],['game','Игра']].map(x=>`<button data-nav="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav></aside>`}function render(){if(!room)return; if(!isHost())return guest();$('app').innerHTML=`<div class="shell">${nav()}<main class="main">${hostPage()}</main></div>`;$('copy').onclick=()=>navigator.clipboard.writeText(code).then(()=>toast('Код скопирован.'));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{tab=b.dataset.nav;render()});bindHost()}
function hostPage(){if(tab==='case')return casePage();if(tab==='characters')return charsPage();if(tab==='truth')return truthPage();if(tab==='lobby')return lobbyPage();return gamePage()}function casePage(){let c=room.caseData;return `<div class="head"><div><h1>Дело</h1><p class="muted">Заполни основу истории. Детектив её увидит только после запуска.</p></div></div><form id="casef" class="card"><div class="grid2"><div class="field"><label>Название дела</label><input name="title" value="${esc(c.title)}"></div><div class="field"><label>Жертва</label><input name="victim" value="${esc(c.victim)}"></div><div class="field"><label>Инцидент</label><input name="incident" value="${esc(c.incident)}"></div><div class="field"><label>Локация</label><input name="location" value="${esc(c.location)}"></div></div><div class="field"><label>Вводная для детектива</label><textarea name="intro">${esc(c.intro)}</textarea></div><button class="btn primary">Сохранить дело</button></form>`}function charsPage(){let c=room.characters[editChar]||room.characters[0];return `<div class="head"><div><h1>Персонажи</h1><p class="muted">Это приватные данные ведущего. Игрок получит свою карточку после назначения.</p></div><button id="addchar" class="btn secondary">+ Персонаж</button></div><div class="chars"><div class="charlist">${room.characters.map((x,i)=>`<button data-char="${i}" class="btn ${i===editChar?'primary':'secondary'}">${esc(x.name||'Без имени')}</button>`).join('')}</div><form id="charf" class="card"><div class="grid2"><div class="field"><label>Имя</label><input name="name" value="${esc(c.name)}"></div><div class="field"><label>Роль / профессия</label><input name="occupation" value="${esc(c.occupation)}"></div><div class="field"><label>Архетип</label><input name="archetype" value="${esc(c.archetype)}" placeholder="Например: нарцисс"></div><div class="field"><label>Связь</label><input name="relation" value="${esc(c.relation)}"></div></div><div class="field"><label>Секрет</label><textarea name="secret">${esc(c.secret)}</textarea></div><div class="field"><label>Личная цель</label><textarea name="goal">${esc(c.goal)}</textarea></div><button class="btn primary">Сохранить персонажа</button></form></div>`}function truthPage(){let t=room.truth;return `<div class="head"><div><h1>Истина дела</h1><p class="muted">Это видишь только ты. Не открывай экран при детективе.</p></div></div><div class="notice">Убийца, мотив, способ и факты не должны быть доступны гостям до развязки.</div><form id="truthf" class="card"><div class="grid2"><div class="field"><label>Убийца</label><select name="killer">${room.characters.map((x,i)=>`<option value="${i}" ${+t.killer===i?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Мотив</label><input name="motive" value="${esc(t.motive)}"></div><div class="field"><label>Способ убийства</label><textarea name="method">${esc(t.method)}</textarea></div><div class="field"><label>Хронология</label><textarea name="chronology">${esc(t.chronology)}</textarea></div></div><div class="label">Факты дела — выдавай их вручную во время расследования</div><div class="facts">${t.facts.map((x,i)=>`<div class="fact"><b>${i+1}</b><input name="fact${i}" value="${esc(x)}"></div>`).join('')}</div><br><button class="btn primary">Сохранить истину</button></form>`}function lobbyPage(){let ps=Object.values(room.players||{});return `<div class="head"><div><h1>Лобби</h1><p class="muted">Ты можешь готовить дело независимо от того, кто уже подключился.</p></div></div><div class="card"><b>Участники</b>${ps.map(p=>`<div class="player"><span>${esc(p.name)}</span><span class="role">${p.role==='host'?'ведущий':p.role==='detective'?'детектив':'игрок'}</span></div>`).join('')}</div>`}function gamePage(){let t=room.truth,active=room.activeInterrogation;return `<div class="head"><div><h1>Игра</h1><p class="muted">Запуск доступен, когда дело готово. Детектив может зайти до или после запуска.</p></div>${room.phase==='setup'?'<button id="start" class="btn primary">Начать расследование</button>':'<span class="role">Расследование идёт</span>'}</div><div class="grid2"><section class="card"><h3>Допрос</h3>${active===null?'<p class="muted">Детектив пока никого не вызвал.</p>':`<p>Сейчас на допросе: <b>${esc(room.characters[active]?.name)}</b></p><button id="endcall" class="btn secondary">Закончить допрос</button>`}</section><section class="card"><h3>Факты</h3>${room.truth.facts.map((f,i)=>`<div class="player"><span>${esc(f||'Пустой факт')}</span><button class="btn secondary" data-fact="${i}" ${room.revealed?.[i]?'disabled':''}>${room.revealed?.[i]?'Выдан':'Выдать'}</button></div>`).join('')}</section></div>`}function bindHost(){if($('casef'))$('casef').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);save('caseData',{title:f.get('title'),victim:f.get('victim'),incident:f.get('incident'),location:f.get('location'),intro:f.get('intro')}).then(()=>toast('Дело сохранено.'))};document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{editChar=+b.dataset.char;render()});if($('addchar'))$('addchar').onclick=()=>{let a=[...room.characters,{name:'Новый персонаж',occupation:'',archetype:'',relation:'',secret:'',goal:''}];save('characters',a);editChar=a.length-1};if($('charf'))$('charf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a=[...room.characters];a[editChar]={name:f.get('name'),occupation:f.get('occupation'),archetype:f.get('archetype'),relation:f.get('relation'),secret:f.get('secret'),goal:f.get('goal')};save('characters',a).then(()=>toast('Персонаж сохранён.'))};if($('truthf'))$('truthf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),facts=room.truth.facts.map((_,i)=>f.get('fact'+i));save('truth',{killer:+f.get('killer'),motive:f.get('motive'),method:f.get('method'),chronology:f.get('chronology'),facts}).then(()=>toast('Истина сохранена.'))};if($('start'))$('start').onclick=()=>save('',{phase:'investigation'}).then(()=>toast('Расследование началось.'));if($('endcall'))$('endcall').onclick=()=>save('activeInterrogation',null);document.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>save('revealed/'+b.dataset.fact,true))}
function guest(){let p=room.players?.[me.uid],role=p?.role;if(role==='detective')return detective();if(role==='player')return player();$('app').innerHTML='<div class="waiting"><section class="panel"><h1>Подключение…</h1><p class="muted">Проверяем роль в комнате.</p></section></div>'}function detective(){if(room.phase!=='investigation'){$('app').innerHTML=`<div class="waiting"><section class="panel"><div class="label">Комната ${code}</div><h1>Дело ещё готовится</h1><p class="muted">Ведущий заполняет материалы. Он сам запустит расследование, когда скажет, что всё готово.</p></section></div>`;return}let c=room.caseData,revealed=Object.keys(room.revealed||{}).map(i=>room.truth.facts[i]).filter(Boolean);$('app').innerHTML=`<main class="main"><div class="head"><div><div class="label">Детектив</div><h1>${esc(c.title||'Дело')}</h1><p class="muted">${esc(c.intro)}</p></div><div class="role">Расследование</div></div><div class="grid2"><section class="card"><h3>Материалы дела</h3><p><b>Жертва:</b> ${esc(c.victim||'не указана')}</p><p><b>Инцидент:</b> ${esc(c.incident||'не указан')}</p><p><b>Локация:</b> ${esc(c.location||'не указана')}</p><h3>Вызвать на допрос</h3><div class="callgrid">${room.characters.map((x,i)=>`<button class="call" data-call="${i}"><b>${esc(x.name)}</b><br><span class="muted">${esc(x.occupation)}</span></button>`).join('')}</div></section><section class="card"><h3>Открытые факты</h3>${revealed.length?revealed.map(x=>`<p>• ${esc(x)}</p>`).join(''):'<p class="muted">Ведущий ещё не раскрыл факты.</p>'}<h3>Заметки</h3><textarea id="notes" placeholder="Твои личные заметки — не видны ведущему"></textarea><button id="accuse" class="btn danger">Финальное обвинение</button></section></div></main>`;document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>save('activeInterrogation',+b.dataset.call));$('accuse').onclick=()=>{let names=room.characters.map((x,i)=>`${i+1}. ${x.name}`).join('\n');let n=prompt('Кого обвиняешь?\n'+names);let i=+n-1;if(Number.isInteger(i)&&room.characters[i])save('accusation',{uid:me.uid,killer:i,at:Date.now()}).then(()=>toast('Обвинение отправлено ведущему.'))}}
function player(){$('app').innerHTML=`<div class="waiting"><section class="panel"><div class="label">Комната ${code}</div><h1>Ты вошёл как игрок</h1><p class="muted">Ведущий назначит тебе персонажа и откроет приватную карточку. Пока можно оставаться в Discord.</p></section></div>`}
authgo().then(u=>{me=u;$('status').textContent='Firebase подключён';landing()}).catch(e=>{$('status').textContent='Ошибка Firebase';toast(e.message)});
</script></body></html>
