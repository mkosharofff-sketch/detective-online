:root{--bg:#0b1210;--p:#121d1a;--p2:#192723;--p3:#0e1714;--line:#30443e;--text:#eef6f3;--muted:#9cafaa;--a:#67d2be;--danger:#ed8195;--warn:#e7b875;--good:#8bddae;--r:14px;--s:16px}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 Manrope,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}h1,h2,h3{line-height:1.15}h1{font-family:Unbounded,sans-serif;font-size:clamp(26px,4vw,38px)}.top{height:66px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#08100d;position:sticky;top:0;z-index:5}.brand{font-family:Unbounded;font-size:14px}.status,.muted{color:var(--muted)}.landing{max-width:1180px;margin:auto;padding:clamp(40px,8vw,100px) 5vw;display:grid;grid-template-columns:1fr 430px;gap:60px}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.98;margin:18px 0}.eyebrow,.label,.role{color:var(--a);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.panel,.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:20px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--p3);padding:5px;border-radius:12px;margin-bottom:18px}.tabs button,.nav button{min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:11px;font-weight:700}.tabs button.active,.nav button.active{background:var(--p2);color:var(--text)}.form{display:none}.form.active{display:block}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;text-transform:uppercase;font-weight:800;color:var(--muted)}input,textarea,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--p3);padding:11px}textarea{min-height:110px;resize:vertical}.btn{min-height:44px;border:0;border-radius:10px;padding:11px 15px;font-weight:800}.primary{background:var(--a);color:#06221d}.secondary{background:var(--p2);border:1px solid var(--line)}.danger{background:var(--danger);color:#2a0810}.ghost{background:transparent;border:1px solid var(--line)}.btns{display:flex;gap:10px;flex-wrap:wrap}.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 66px)}aside{padding:20px;border-right:1px solid var(--line);background:var(--p3)}.code{font-family:Unbounded;font-size:24px;letter-spacing:.12em;margin:7px 0 14px}.nav{display:grid;gap:4px;margin-top:22px}.nav button{text-align:left}.main{padding:clamp(18px,4vw,40px);max-width:1200px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:22px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.chars{display:grid;grid-template-columns:220px 1fr;gap:16px}.charlist{display:grid;align-content:start;gap:8px}.charlist button{text-align:left}.sep{height:1px;background:var(--line);margin:18px 0}.notice{padding:14px;border-radius:11px;background:#3a2b1d;color:#f6dfbe;margin-bottom:15px}.notice.good{background:#193426;color:#caf3d8}.notice.bad{background:#3c1d27;color:#ffd3dc}.person,.fact,.log{padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:8px}.stat{background:var(--p3);border:1px solid var(--line);border-radius:13px;padding:16px}.stat strong{display:block;font:700 23px Unbounded;margin-top:6px}.callgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.call{min-height:88px;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--p2);text-align:left}.call.on{border-color:var(--good);background:#193426;opacity:1}.call.on:disabled{opacity:1}.ntabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.ntabs button{min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--p3);color:var(--muted);font-weight:700;font-size:14px}.ntabs button.active{background:var(--a);color:#06221d;border-color:var(--a)}.ntabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}.waiting{max-width:640px;margin:12vh auto;padding:20px;text-align:center}.check{display:flex;gap:10px;align-items:center;padding:11px;margin-top:8px;background:var(--p3);border-radius:10px}.mark{color:var(--danger);font-weight:800}.check.ok .mark{color:var(--good)}.toast{position:fixed;right:16px;bottom:16px;max-width:400px;background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:14px;transform:translateY(150%);transition:.2s;z-index:20}.toast.show{transform:none}.modalwrap{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#030807cc;z-index:15}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:18px;padding:22px}.hidden{display:none!important}@media(max-width:850px){.landing,.shell,.grid2,.grid3,.chars{grid-template-columns:1fr}.landing{gap:30px}.shell aside{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}}@media(max-width:560px){.landing{padding-top:30px}.tabs{grid-template-columns:1fr}.callgrid{grid-template-columns:1fr}.head{display:block}.head>.btns,.head>button{margin-top:14px}.person,.fact,.log{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div class="brand">ДЕЛО // ONLINE</div><div id="status" class="status">Подключение…</div></header><main id="app"></main><div id="toast" class="toast" role="status"></div><div id="modal"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{getDatabase,ref,get,set,update,onValue,runTransaction}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const cfg={apiKey:'AIzaSyCxpowPqAwwtEVzxdyk1nVAzZ2HJKSJH1Q',authDomain:'delo-1b821.firebaseapp.com',databaseURL:'https://delo-1b821-default-rtdb.europe-west1.firebasedatabase.app',projectId:'delo-1b821',storageBucket:'delo-1b821.firebasestorage.app',messagingSenderId:'438900845008',appId:'1:438900845008:web:e308c6cf469f53593231d5'},fb=initializeApp(cfg),auth=getAuth(fb),db=getDatabase(fb);let me,code='',role='',tab='case',selected='',st={join:null,public:null,participants:null,hostPrivate:null,playerPrivate:null,detectivePrivate:null},subs=[],tt,noteTab='general',draft={},nTimers={},lastActive='';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clean=x=>String(x??'').trim(),vals=x=>Object.values(x||{}),ents=x=>Object.entries(x||{}),rid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),rr=p=>ref(db,'rooms/'+code+(p?'/'+p:''));function toast(x){$('toast').textContent=x;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),3500)}function err(e){console.error(e);return e?.message||'Ошибка Firebase'}async function act(fn,msg){try{await fn();msg&&toast(msg)}catch(e){toast(err(e));throw e}}async function authgo(){if(auth.currentUser){me=auth.currentUser;return me}me=(await signInAnonymously(auth)).user;return me}function gen(){let a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join('')}function defaultChars(){return Object.fromEntries([1,2,3].map(i=>['char_'+i,{id:'char_'+i,name:'Подозреваемый '+i,profession:'',archetype:'',relations:'',secret:'',personalGoal:''}]))}function defaultTruth(){return{killerId:'',motive:'',method:'',chronology:'',ending:'',facts:{fact_1:'',fact_2:'',fact_3:'',fact_4:'',fact_5:'',fact_6:''}}}function pubchar(c){return{id:c.id,name:c.name,profession:c.profession||'',archetype:c.archetype||'',relations:c.relations||''}}function privchar(c,t){let x={...pubchar(c),secret:c.secret||'',personalGoal:c.personalGoal||''};if(t?.killerId===c.id)x.murdererInfo={motive:t.motive||'',method:t.method||''};return x}function roomData(name,max){let chars=defaultChars();return{join:{open:true,maxPlayers:max,detectiveUid:'',createdAt:Date.now()},participants:{[me.uid]:{uid:me.uid,name,role:'host',joinedAt:Date.now()}},public:{status:'setup',maxPlayers:max,case:{title:'Новое дело',victim:'',incident:'',location:'',intro:''},suspects:Object.fromEntries(vals(chars).map(c=>[c.id,pubchar(c)])),facts:{},interrogationLog:{},endingPublished:false},hostPrivate:{hostUid:me.uid,characters:chars,truth:defaultTruth()}}}function stop(){subs.forEach(x=>x());subs=[]}function listen(path,key){subs.push(onValue(rr(path),s=>{st[key]=s.val();render()},e=>toast(err(e))))}async function enter(c,r){stop();st={};code=c;role=r;history.replaceState(null,'',location.pathname+'#room='+c);$('status').textContent='Комната '+c;if(r==='host'){for(let [p,k]of[['join','join'],['public','public'],['participants','participants'],['hostPrivate','hostPrivate'],['playerPrivate','playerPrivate'],['detectivePrivate','detectivePrivate']])listen(p,k)}else{listen('public','public');listen('participants','participants');listen('playerPrivate/'+me.uid,'playerPrivate');listen('detectivePrivate/'+me.uid,'detectivePrivate')}}function leave(){vals(nTimers).forEach(clearTimeout);stop();code=role='';draft={};noteTab='general';lastActive='';history.replaceState(null,'',location.pathname);$('status').textContent='Firebase подключён';landing()}
function landing(pre=''){$('app').innerHTML=`<div class="landing"><section class="hero"><div class="eyebrow">Устный детектив для Discord</div><h1>Истина у одного. Версия — у каждого.</h1><p class="muted">Ведущий готовит дело, детектив ведёт допросы, а игроки скрывают секреты персонажей. Одно финальное обвинение решает всё.</p></section><section class="panel"><div class="tabs"><button class="active" data-t="host">Ведущий</button><button data-t="detective">Детектив</button><button data-t="player">Игрок</button></div><form id="f-host" class="form active"><div class="field"><label>Имя ведущего</label><input id="hn" maxlength="40" required></div><div class="field"><label>Игроков-персонажей</label><select id="hm">${[1,2,3,4,5,6,7,8].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary">Создать дело</button></form><form id="f-detective" class="form"><div class="field"><label>Имя детектива</label><input id="dn" required></div><div class="field"><label>Код</label><input id="dc" maxlength="6" value="${pre}" required></div><button class="btn primary">Войти детективом</button></form><form id="f-player" class="form"><div class="field"><label>Имя игрока</label><input id="pn" required></div><div class="field"><label>Код</label><input id="pc" maxlength="6" value="${pre}" required></div><button class="btn primary">Войти игроком</button></form></section></div>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));$('f-'+b.dataset.t).classList.add('active')});$('f-host').onsubmit=create;$('f-detective').onsubmit=e=>join(e,'detective');$('f-player').onsubmit=e=>join(e,'player')}
async function create(e){e.preventDefault();let name=clean($('hn').value),max=+$('hm').value;if(!name)return;try{await authgo();for(let i=0;i<12;i++){let c=gen();try{await set(ref(db,'rooms/'+c),roomData(name,max));tab='case';selected='char_1';return enter(c,'host')}catch(x){if(!String(x.code).includes('permission'))throw x}}throw Error('Не удалось создать комнату. Опубликуй database.rules.json в Firebase Console.')}catch(x){toast(err(x))}}async function join(e,r){e.preventDefault();let det=r==='detective',name=clean($(det?'dn':'pn').value),c=clean($(det?'dc':'pc').value).toUpperCase();if(!name||c.length!==6)return toast('Введи имя и код.');try{await authgo();let j=await get(ref(db,'rooms/'+c+'/join'));if(!j.exists()||j.val().open===false)throw Error('Комната не найдена.');if(det){let q=await runTransaction(ref(db,'rooms/'+c+'/join/detectiveUid'),v=>!v||v===me.uid?me.uid:undefined);if(!q.committed)throw Error('Детектив уже занят.')}let u={};u['rooms/'+c+'/participants/'+me.uid]={uid:me.uid,name,role:r,joinedAt:Date.now()};if(det)u['rooms/'+c+'/detectivePrivate/'+me.uid]={notesBy:{general:''}};await update(ref(db),u);enter(c,r)}catch(x){toast(err(x))}}
function render(){if(!code)return;if(role==='host')host();else if(role==='detective')detective();else player()}function loading(){$('app').innerHTML='<div class="waiting"><section class="panel"><h1>Загрузка…</h1><p class="muted">Синхронизируем данные.</p></section></div>'}function nav(){return`<aside><div class="label">Код комнаты</div><div class="code">${code}</div><div class="btns"><button id="copy" class="btn secondary">Копировать</button><button id="leave" class="btn ghost">Выйти</button></div><nav class="nav">${[['case','Дело'],['chars','Персонажи'],['truth','Истина'],['lobby','Лобби'],['game','Игра'],['preview','Предпросмотр']].map(x=>`<button data-nav="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav></aside>`}function host(){if(!st.public||!st.participants||!st.hostPrivate)return loading();$('app').innerHTML=`<div class="shell">${nav()}<section class="main">${page()}</section></div>`;$('copy').onclick=()=>navigator.clipboard?.writeText(code).then(()=>toast('Код скопирован.')).catch(()=>toast(code));$('leave').onclick=leave;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{tab=b.dataset.nav;render()});bindHost()}function page(){return tab==='case'?casePage():tab==='chars'?charsPage():tab==='truth'?truthPage():tab==='lobby'?lobbyPage():tab==='preview'?previewPage():gamePage()}
function casePage(){let c=st.public.case||{};return`<header class="head"><div><div class="label">Подготовка</div><h1>Карточка дела</h1><p class="muted">Вводную детектив увидит после запуска.</p></div></header><form id="casef" class="card"><div class="grid2"><div class="field"><label>Название</label><input name="title" value="${esc(c.title)}" required></div><div class="field"><label>Жертва</label><input name="victim" value="${esc(c.victim)}" required></div><div class="field"><label>Инцидент</label><input name="incident" value="${esc(c.incident)}"></div><div class="field"><label>Локация</label><input name="location" value="${esc(c.location)}"></div></div><div class="field"><label>Вводная</label><textarea name="intro" required>${esc(c.intro)}</textarea></div><button class="btn primary">Сохранить</button></form>`}function charsPage(){let cs=st.hostPrivate.characters||{};if(!selected||!cs[selected])selected=Object.keys(cs)[0]||'';let c=cs[selected],players=vals(st.participants).filter(x=>x.role==='player'),assigned=players.find(x=>x.characterId===selected);if(!c)return`<header class="head"><h1>Персонажи</h1><button id="addc" class="btn primary">Добавить</button></header>`;return`<header class="head"><div><div class="label">Приватные карточки</div><h1>Персонажи</h1></div><button id="addc" class="btn secondary">+ Персонаж</button></header><div class="chars"><div class="charlist">${vals(cs).map(x=>`<button data-char="${x.id}" class="btn ${x.id===selected?'primary':'secondary'}">${esc(x.name)}</button>`).join('')}</div><form id="charf" class="card"><div class="grid2"><div class="field"><label>Имя</label><input name="name" value="${esc(c.name)}" required></div><div class="field"><label>Профессия</label><input name="profession" value="${esc(c.profession)}"></div><div class="field"><label>Архетип</label><input name="archetype" value="${esc(c.archetype)}"></div><div class="field"><label>Связь с жертвой</label><input name="relations" value="${esc(c.relations)}"></div></div><div class="field"><label>Секрет</label><textarea name="secret">${esc(c.secret)}</textarea></div><div class="field"><label>Личная цель</label><textarea name="personalGoal">${esc(c.personalGoal)}</textarea></div><div class="field"><label>Назначить игроку</label><select name="uid"><option value="">Не назначен</option>${players.map(p=>`<option value="${p.uid}" ${assigned?.uid===p.uid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="btns"><button class="btn primary">Сохранить</button><button id="delc" type="button" class="btn ghost">Удалить</button></div></form></div>`}function truthPage(){let t=st.hostPrivate.truth||defaultTruth(),cs=st.hostPrivate.characters||{};return`<header class="head"><div><div class="label">Только ведущий</div><h1>Истина дела</h1></div></header><div class="notice">После сохранения карточка убийцы обновится автоматически.</div><form id="truthf" class="card"><div class="grid2"><div class="field"><label>Убийца</label><select name="killerId" required><option value="">Не выбран</option>${vals(cs).map(c=>`<option value="${c.id}" ${t.killerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Мотив</label><input name="motive" value="${esc(t.motive)}" required></div></div><div class="field"><label>Способ</label><textarea name="method" required>${esc(t.method)}</textarea></div><div class="field"><label>Хронология</label><textarea name="chronology">${esc(t.chronology)}</textarea></div><div class="field"><label>Развязка</label><textarea name="ending" required>${esc(t.ending)}</textarea></div><div class="label">Факты</div>${ents(t.facts).map(([id,x],i)=>`<div class="fact"><b>${i+1}</b><input name="${id}" value="${esc(x)}"><button type="button" class="btn ghost" data-delf="${id}">Удалить</button></div>`).join('')}<div class="btns" style="margin-top:16px"><button class="btn primary">Сохранить</button><button id="addf" type="button" class="btn secondary">+ Факт</button></div></form>`}function lobbyPage(){let p=vals(st.participants),d=p.filter(x=>x.role==='detective').length,pl=p.filter(x=>x.role==='player').length;return`<header class="head"><div><div class="label">Подключения</div><h1>Лобби</h1></div></header><div class="grid3"><div class="stat"><span class="muted">Детектив</span><strong>${d}/1</strong></div><div class="stat"><span class="muted">Игроки</span><strong>${pl}/${st.public.maxPlayers}</strong></div><div class="stat"><span class="muted">Фаза</span><strong>${phase(st.public.status)}</strong></div></div><section class="card" style="margin-top:16px">${p.map(x=>`<div class="person"><span><b>${esc(x.name)}</b><br><small class="muted">${x.characterId?esc(st.hostPrivate.characters?.[x.characterId]?.name):'без персонажа'}</small></span><span class="role">${x.role}</span></div>`).join('')}</section>`}function phase(x){return{setup:'Подготовка',investigation:'Игра',finished:'Финал'}[x]||x}function checks(){let c=st.public.case||{},t=st.hostPrivate.truth||{};return[[clean(c.title)&&clean(c.victim)&&clean(c.intro),'Заполнено дело'],[vals(st.public.suspects).length>=2,'Есть два подозреваемых'],[t.killerId&&clean(t.motive)&&clean(t.method),'Заполнена истина'],[clean(t.ending),'Есть развязка'],[vals(st.participants).some(x=>x.role==='detective'),'Подключён детектив']]}function gamePage(){let p=st.public,t=st.hostPrivate.truth||{},a=p.activeInterrogation,acc=ents(st.detectivePrivate).map(x=>x[1]?.accusation).find(Boolean),ck=checks(),ready=ck.every(x=>x[0]);return`<header class="head"><div><div class="label">Управление партией</div><h1>Игра</h1></div>${p.status==='setup'?`<button id="start" class="btn primary" ${ready?'':'disabled'}>Начать</button>`:`<span class="role">${phase(p.status)}</span>`}</header>${p.status==='setup'?`<section class="card">${ck.map(x=>`<div class="check ${x[0]?'ok':''}"><span class="mark">${x[0]?'✓':'!'}</span>${x[1]}</div>`).join('')}</section>`:''}<div class="grid2" style="margin-top:16px"><section class="card"><h2>Допрос</h2><div class="sep"></div>${a?`<div class="notice good"><b>${esc(a.characterName)}</b></div><button id="finish" class="btn secondary">Завершить</button>`:'<p class="muted">Никто не вызван.</p>'}</section><section class="card"><h2>Обвинение</h2><div class="sep"></div>${acc?`<div class="notice bad"><b>${esc(acc.suspectName)}</b><p>${esc(acc.reason)}</p></div>${p.endingPublished?'Развязка открыта.':'<button id="ending" class="btn danger">Открыть развязку</button>'}`:'<p class="muted">Пока нет.</p>'}</section></div><section class="card" style="margin-top:16px"><h2>Факты</h2>${ents(t.facts).map(([id,x],i)=>`<div class="fact"><span><b>${i+1}.</b> ${esc(x||'Не заполнен')}</span><button data-reveal="${id}" class="btn secondary" ${!x||p.facts?.[id]?'disabled':''}>${p.facts?.[id]?'Выдан':'Выдать'}</button></div>`).join('')}</section>`}function previewPage(){return`<header class="head"><div><div class="label">Проверка</div><h1>Предпросмотр</h1></div></header><div class="grid2"><section class="card"><h2>Детектив видит</h2><div class="sep"></div>${vals(st.public.suspects).map(x=>`<div class="person"><b>${esc(x.name)}</b><span class="muted">${esc(x.profession)}</span></div>`).join('')}</section><section class="card"><h2>Приватные карточки</h2><div class="sep"></div>${vals(st.participants).filter(x=>x.role==='player').map(x=>`<div class="person"><b>${esc(x.name)}</b><span>${esc(st.playerPrivate?.[x.uid]?.name||'не назначен')}</span></div>`).join('')}</section></div>`}
function bindHost(){if($('casef'))$('casef').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);act(()=>set(rr('public/case'),Object.fromEntries(['title','victim','incident','location','intro'].map(x=>[x,clean(f.get(x))]))),'Дело сохранено.')};document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{selected=b.dataset.char;render()});if($('addc'))$('addc').onclick=async()=>{let id=rid('char'),c={id,name:'Новый персонаж',profession:'',archetype:'',relations:'',secret:'',personalGoal:''};await act(()=>update(rr(),{['hostPrivate/characters/'+id]:c,['public/suspects/'+id]:pubchar(c)}),'Персонаж добавлен.');selected=id};if($('charf'))$('charf').onsubmit=saveChar;if($('delc'))$('delc').onclick=delChar;if($('truthf'))$('truthf').onsubmit=saveTruth;if($('addf'))$('addf').onclick=()=>set(rr('hostPrivate/truth/facts/'+rid('fact')),'');document.querySelectorAll('[data-delf]').forEach(b=>b.onclick=()=>set(rr('hostPrivate/truth/facts/'+b.dataset.delf),null));if($('start'))$('start').onclick=()=>update(rr('public'),{status:'investigation',startedAt:Date.now()});if($('finish'))$('finish').onclick=finishCall;document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>set(rr('public/facts/'+b.dataset.reveal),st.hostPrivate.truth.facts[b.dataset.reveal]));if($('ending'))$('ending').onclick=publish}
async function saveChar(e){e.preventDefault();let f=new FormData(e.target),old=st.hostPrivate.characters[selected],c={...old};for(let k of['name','profession','archetype','relations','secret','personalGoal'])c[k]=clean(f.get(k));let uid=clean(f.get('uid')),u={['hostPrivate/characters/'+selected]:c,['public/suspects/'+selected]:pubchar(c)};vals(st.participants).filter(p=>p.role==='player'&&p.characterId===selected&&p.uid!==uid).forEach(p=>{u['participants/'+p.uid+'/characterId']=null;u['playerPrivate/'+p.uid]=null});if(uid){u['participants/'+uid+'/characterId']=selected;u['playerPrivate/'+uid]=privchar(c,st.hostPrivate.truth)}await act(()=>update(rr(),u),'Персонаж сохранён.')}async function delChar(){let c=st.hostPrivate.characters[selected];if(!confirm('Удалить '+c.name+'?'))return;let u={['hostPrivate/characters/'+selected]:null,['public/suspects/'+selected]:null};vals(st.participants).filter(p=>p.characterId===selected).forEach(p=>{u['participants/'+p.uid+'/characterId']=null;u['playerPrivate/'+p.uid]=null});await update(rr(),u);selected=''}async function saveTruth(e){e.preventDefault();let f=new FormData(e.target),facts={};ents(st.hostPrivate.truth.facts).forEach(([id])=>facts[id]=clean(f.get(id)));let t={killerId:clean(f.get('killerId')),motive:clean(f.get('motive')),method:clean(f.get('method')),chronology:clean(f.get('chronology')),ending:clean(f.get('ending')),facts},u={'hostPrivate/truth':t};vals(st.participants).filter(p=>p.role==='player'&&p.characterId).forEach(p=>u['playerPrivate/'+p.uid]=privchar(st.hostPrivate.characters[p.characterId],t));await act(()=>update(rr(),u),'Истина сохранена.')}async function finishCall(){let a=st.public.activeInterrogation,id=rid('call');await update(rr('public'),{activeInterrogation:null,['interrogationLog/'+id]:{...a,finishedAt:Date.now()}})}async function publish(){let t=st.hostPrivate.truth,k=st.hostPrivate.characters[t.killerId];await update(rr('public'),{status:'finished',endingPublished:true,ending:{killerId:k.id,killerName:k.name,motive:t.motive,method:t.method,chronology:t.chronology,text:t.ending}})}
function wait(title,text){$('app').innerHTML=`<div class="waiting"><section class="panel"><div class="label">Комната ${code}</div><h1>${title}</h1><p class="muted">${text}</p><button id="leave" class="btn ghost">Выйти</button></section></div>`;$('leave').onclick=leave}function ending(e){return e?`<section class="card" style="margin-bottom:16px"><div class="label">Развязка</div><h2>Убийца — ${esc(e.killerName)}</h2><p><b>Мотив:</b> ${esc(e.motive)}</p><p><b>Способ:</b> ${esc(e.method)}</p><p>${esc(e.text)}</p></section>`:''}
function saveNote(k){clearTimeout(nTimers[k]);if(draft[k]===undefined)return Promise.resolve();return set(rr('detectivePrivate/'+me.uid+'/notesBy/'+k),draft[k]).catch(e=>toast(err(e)))}
function detective(){if(!st.public||!st.participants)return loading();let p=st.public,d=st.detectivePrivate||{};if(p.status==='setup')return wait('Дело ещё готовится','Ведущий сам запустит расследование.');let c=p.case||{},ss=vals(p.suspects),a=p.activeInterrogation,fin=p.status==='finished';if(a&&a.characterId!==lastActive){lastActive=a.characterId;if(ss.some(s=>s.id===a.characterId))noteTab=a.characterId}if(!a)lastActive='';if(noteTab!=='general'&&!ss.some(s=>s.id===noteTab))noteTab='general';let nv=k=>draft[k]??(k==='general'?(d.notesBy?.general??d.notes??''):(d.notesBy?.[k]??'')),ae=document.activeElement,keep=ae&&ae.id==='notes'?[ae.selectionStart,ae.selectionEnd]:null,curName=noteTab==='general'?'Общие заметки':(ss.find(s=>s.id===noteTab)?.name||'');$('app').innerHTML=`<section class="main"><header class="head"><div><div class="label">Детектив · ${code}</div><h1>${esc(c.title)}</h1><p class="muted">${esc(c.intro)}</p></div><button id="leave" class="btn ghost">Выйти</button></header>${ending(p.ending)}<div class="grid2"><section class="card"><p><b>Жертва:</b> ${esc(c.victim)}</p><p><b>Инцидент:</b> ${esc(c.incident)}</p><p><b>Локация:</b> ${esc(c.location)}</p><div class="sep"></div><h2>Допрос</h2>${a?`<div class="notice good" style="margin-top:12px">Сейчас на допросе: <b>${esc(a.characterName)}</b></div><button id="endcall" class="btn primary" style="width:100%;margin-bottom:14px">Закончить допрос</button>`:`<p class="muted">${fin?'Расследование завершено.':'Выбери, кого вызвать на допрос.'}</p>`}<div class="callgrid">${ss.map(s=>`<button data-call="${s.id}" class="call ${a?.characterId===s.id?'on':''}" ${a||fin?'disabled':''}><b>${esc(s.name)}</b><br><span class="muted">${esc(s.profession)}</span></button>`).join('')}</div></section><section class="card"><h2>Открытые факты</h2>${vals(p.facts).length?vals(p.facts).map(x=>`<div class="person">${esc(x)}</div>`).join(''):'<p class="muted">Фактов пока нет.</p>'}<div class="sep"></div><h2>Личные заметки</h2><div class="ntabs"><button data-nt="general" class="${noteTab==='general'?'active':''}">Общие</button>${ss.map(s=>`<button data-nt="${s.id}" class="${noteTab===s.id?'active':''}">${a?.characterId===s.id?'<span class="dot"></span>':''}${esc(s.name)}</button>`).join('')}</div><textarea id="notes" style="min-height:170px" placeholder="${esc(curName)} — видишь только ты. Сохраняется автоматически.">${esc(nv(noteTab))}</textarea><div class="sep"></div>${d.accusation?`<div class="notice bad"><b>${esc(d.accusation.suspectName)}</b><p>${esc(d.accusation.reason)}</p></div>`:`<button id="accuse" class="btn danger" ${fin?'disabled':''}>Финальное обвинение</button>`}</section></div></section>`;if(keep&&$('notes')){let n=$('notes');n.focus();try{n.setSelectionRange(keep[0],keep[1])}catch(x){}}$('leave').onclick=leave;document.querySelectorAll('[data-call]').forEach(b=>b.onclick=async()=>{let s=ss.find(x=>x.id===b.dataset.call);if(!s)return;try{let r=await runTransaction(rr('public/activeInterrogation'),x=>x??{characterId:s.id,characterName:s.name,detectiveUid:me.uid,startedAt:Date.now()});if(!r.committed)toast('Допрос уже идёт.')}catch(x){toast(err(x))}});if($('endcall'))$('endcall').onclick=async()=>{try{await saveNote(noteTab);await set(rr('public/activeInterrogation'),null)}catch(x){toast(err(x))}};document.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{saveNote(noteTab);noteTab=b.dataset.nt;render()});$('notes').oninput=e=>{let k=noteTab;draft[k]=e.target.value;clearTimeout(nTimers[k]);nTimers[k]=setTimeout(()=>saveNote(k),500)};if($('accuse'))$('accuse').onclick=()=>accuse(ss)}function accuse(ss){$('modal').innerHTML=`<div class="modalwrap"><form id="accf" class="modal"><h2>Единственное обвинение</h2><div class="notice bad">После отправки его нельзя изменить.</div><div class="field"><label>Подозреваемый</label><select name="id" required><option value="">Выбери</option>${ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Обоснование</label><textarea name="reason" required></textarea></div><div class="btns"><button class="btn danger">Отправить</button><button id="cancel" type="button" class="btn secondary">Отмена</button></div></form></div>`;$('cancel').onclick=()=>{$('modal').innerHTML=''};$('accf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),s=ss.find(x=>x.id===f.get('id')),reason=clean(f.get('reason'));let r=await runTransaction(rr('detectivePrivate/'+me.uid+'/accusation'),x=>x??{suspectId:s.id,suspectName:s.name,reason,submittedAt:Date.now()});if(r.committed)$('modal').innerHTML=''}}function player(){if(!st.public||!st.participants)return loading();let c=st.playerPrivate,p=st.public;if(!c)return wait('Карточка ещё не назначена','Ведущий видит тебя в лобби.');let called=p.activeInterrogation?.characterId===c.id;$('app').innerHTML=`<section class="main"><header class="head"><div><div class="label">Игрок · ${code}</div><h1>${esc(c.name)}</h1><p class="muted">Эта карточка приватна.</p></div><button id="leave" class="btn ghost">Выйти</button></header>${ending(p.ending)}${called?'<div class="notice good"><b>Тебя вызвали на допрос.</b></div>':''}<div class="grid2"><section class="card"><div class="label">Публичный образ</div><p><b>Профессия:</b> ${esc(c.profession)}</p><p><b>Архетип:</b> ${esc(c.archetype)}</p><p><b>Связь:</b> ${esc(c.relations)}</p></section><section class="card"><div class="label">Только для тебя</div><h2>Секрет</h2><p>${esc(c.secret)}</p><h2>Личная цель</h2><p>${esc(c.personalGoal)}</p></section></div>${c.murdererInfo?`<section class="card" style="margin-top:16px;border-color:var(--danger)"><div class="label">Ты — убийца</div><p><b>Мотив:</b> ${esc(c.murdererInfo.motive)}</p><p><b>Способ:</b> ${esc(c.murdererInfo.method)}</p></section>`:''}</section>`;$('leave').onclick=leave}
