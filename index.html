function buildRoom(name, maxPlayers) {
  const characters = defaultCharacters();

  const participants = {};
  participants[me.uid] = {
    uid: me.uid,
    name,
    role: 'host',
    joinedAt: now()
  };

  return {
    participants,

    public: {
      status: 'setup',
      maxPlayers,
      createdAt: now(),
      case: {
        title: 'Новое дело',
        victim: '',
        incident: '',
        intro: '',
        location: ''
      },
      suspects: characters.map(character => ({
        id: character.id,
        name: character.name,
        profession: character.profession,
        archetype: character.archetype,
        relations: character.relations
      })),
      facts: {},
      activeInterrogation: null,
      interrogationLog: {},
      endingPublished: false
    },

    hostPrivate: {
      hostUid: me.uid,
      characters,
      truth: defaultTruth()
    },

    playerPrivate: {},
    detectivePrivate: {}
  };
}

function subscribe() {
  unsubscribe?.();

  unsubscribe = onValue(roomRef(), snapshot => {
    room = snapshot.val();

    if (!room) {
      toast('Комната больше не существует.');
      landing();
      return;
    }

    render();
  });
}

async function createRoom() {
  const name = $('hostName').value.trim();
  const maxPlayers = Number($('maxPlayers').value);

  if (!name) {
    toast('Введи имя ведущего.');
    return;
  }

  await ensureAuth();

  let selectedCode = '';

  for (let attempt = 0; attempt < 10; attempt++) {
    const candidate = generateCode();
    const snapshot = await get(ref(db, `rooms/${candidate}`));

    if (!snapshot.exists()) {
      selectedCode = candidate;
      break;
    }
  }

  if (!selectedCode) {
    toast('Не удалось подобрать свободный код.');
    return;
  }

  code = selectedCode;

  await set(roomRef(), buildRoom(name, maxPlayers));

  tab = 'case';
  subscribe();
  toast(`Комната ${code} создана.`);
}

async function joinRoom(role) {
  const isDetectiveRole = role === 'detective';
  const name = $(isDetectiveRole ? 'detectiveName' : 'playerName').value.trim();
  const enteredCode = $(isDetectiveRole ? 'detectiveCode' : 'playerCode')
    .value
    .trim()
    .toUpperCase();

  if (!name || !enteredCode) {
    toast('Введи имя и код комнаты.');
    return;
  }

  await ensureAuth();

  const targetRef = ref(db, `rooms/${enteredCode}`);
  const snapshot = await get(targetRef);

  if (!snapshot.exists()) {
    toast('Комната не найдена.');
    return;
  }

  const targetRoom = snapshot.val();
  const targetParticipants = targetRoom.participants || {};

  if (isDetectiveRole) {
    const existingDetective = Object.values(targetParticipants)
      .find(player => player.role === 'detective');

    if (existingDetective && existingDetective.uid !== me.uid) {
      toast('В этой комнате уже есть детектив.');
      return;
    }
  }

  const participantData = {
    uid: me.uid,
    name,
    role,
    joinedAt: now()
  };

  code = enteredCode;

  await set(ref(db, `rooms/${code}/participants/${me.uid}`), participantData);

  if (role === 'detective') {
    await set(ref(db, `rooms/${code}/detectivePrivate/${me.uid}`), {
      notes: '',
      accusation: null
    });
  }

  subscribe();
  toast('Ты вошёл в комнату.');
}

function bindHost() {
  const caseForm = $('caseForm');

  if (caseForm) {
    caseForm.onsubmit = async event => {
      event.preventDefault();

      const form = new FormData(caseForm);

      await savePublic({
        case: {
          title: form.get('title'),
          victim: form.get('victim'),
          incident: form.get('incident'),
          intro: form.get('intro'),
          location: form.get('location')
        }
      });

      toast('Дело сохранено.');
    };
  }

  document.querySelectorAll('[data-character-index]').forEach(button => {
    button.onclick = () => {
      editChar = Number(button.dataset.characterIndex);
      render();
    };
  });

  const addCharacter = $('addCharacter');

  if (addCharacter) {
    addCharacter.onclick = async () => {
      const characters = [...(room.hostPrivate?.characters || [])];

      characters.push({
        id: `char_${Date.now()}`,
        name: 'Новый персонаж',
        profession: '',
        archetype: '',
        relations: '',
        secret: '',
        personalGoal: '',
        murdererInfo: null
      });

      await saveHostPrivate({characters});
      editChar = characters.length - 1;
      toast('Персонаж добавлен.');
    };
  }

  const characterForm = $('characterForm');

  if (characterForm) {
    characterForm.onsubmit = async event => {
      event.preventDefault();

      const form = new FormData(characterForm);
      const characters = [...(room.hostPrivate?.characters || [])];
      const current = characters[editChar];

      if (!current) return;

      characters[editChar] = {
        ...current,
        name: form.get('name'),
        profession: form.get('profession'),
        archetype: form.get('archetype'),
        relations: form.get('relations'),
        secret: form.get('secret'),
        personalGoal: form.get('personalGoal')
      };

      const selectedUid = form.get('assignedUid');

      const participantUpdates = {};
      const playerPrivateUpdates = {};

      Object.values(room.participants || {})
        .filter(item => item.role === 'player')
        .forEach(item => {
          if (item.characterId === current.id) {
            participantUpdates[item.uid] = {
              ...item,
              characterId: null
            };
          }
        });

      if (selectedUid) {
        participantUpdates[selectedUid] = {
          ...(room.participants?.[selectedUid] || {}),
          characterId: current.id
        };

        const assignedCharacter = characters[editChar];

        playerPrivateUpdates[selectedUid] = {
          characterId: assignedCharacter.id,
          name: assignedCharacter.name,
          profession: assignedCharacter.profession,
          archetype: assignedCharacter.archetype,
          relations: assignedCharacter.relations,
          secret: assignedCharacter.secret,
          personalGoal: assignedCharacter.personalGoal,
          murdererInfo: assignedCharacter.murdererInfo || null
        };
      }

      await saveHostPrivate({characters});
      await savePublic({
        suspects: characters.map(character => ({
          id: character.id,
          name: character.name,
          profession: character.profession,
          archetype: character.archetype,
          relations: character.relations
        }))
      });

      for (const [uid, data] of Object.entries(participantUpdates)) {
        await set(ref(db, `rooms/${code}/participants/${uid}`), data);
      }

      for (const [uid, data] of Object.entries(playerPrivateUpdates)) {
        await set(ref(db, `rooms/${code}/playerPrivate/${uid}`), data);
      }

      toast('Персонаж и назначение сохранены.');
    };
  }

  const truthForm = $('truthForm');

  if (truthForm) {
    truthForm.onsubmit = async event => {
      event.preventDefault();

      const form = new FormData(truthForm);
      const oldFacts = room.hostPrivate?.truth?.facts || [];
      const facts = oldFacts.map((_, index) => form.get(`fact${index}`) || '');

      const truth = {
        killerId: form.get('killerId'),
        motive: form.get('motive'),
        method: form.get('method'),
        chronology: form.get('chronology'),
        ending: form.get('ending'),
        facts
      };

      const characters = room.hostPrivate?.characters || [];
      const updatedCharacters = characters.map(character => ({
        ...character,
        murdererInfo: character.id === truth.killerId
          ? {
              motive: truth.motive,
              method: truth.method
            }
          : null
      }));

      await saveHostPrivate({
        truth,
        characters: updatedCharacters
      });

      toast('Истина сохранена.');
    };
  }

  const startButtons = [
    $('startInvestigation'),
    $('startFromLobby')
  ].filter(Boolean);

  startButtons.forEach(button => {
    button.onclick = async () => {
      const hasDetective = Object.values(room.participants || {})
        .some(item => item.role === 'detective');

      if (!hasDetective) {
        toast('Сначала дождись детектива.');
        return;
      }

      await savePublic({status: 'investigation'});
      toast('Расследование началось.');
    };
  });

  const finishInterrogation = $('finishInterrogation');

  if (finishInterrogation) {
    finishInterrogation.onclick = async () => {
      const active = room.public?.activeInterrogation;

      if (!active) return;

      const logId = `interrogation_${Date.now()}`;

      await update(roomRef('public'), {
        activeInterrogation: null,
        [`interrogationLog/${logId}`]: {
          ...active,
          finishedAt: now()
        }
      });

      toast('Допрос завершён.');
    };
  }

  document.querySelectorAll('[data-reveal-fact]').forEach(button => {
    button.onclick = async () => {
      const index = button.dataset.revealFact;
      const fact = room.hostPrivate?.truth?.facts?.[index];

      if (!fact) {
        toast('Сначала заполни этот факт в разделе «Истина».');
        return;
      }

      await update(roomRef('public'), {
        [`facts/${index}`]: fact
      });

      toast('Факт выдан детективу.');
    };
  });

  const publishEnding = $('publishEnding');

  if (publishEnding) {
    publishEnding.onclick = async () => {
      await savePublic({endingPublished: true});
      toast('Развязка открыта.');
    };
  }
}

function detectiveRender() {
  const publicData = room.public || {};

  if (publicData.status !== 'investigation') {
    $('app').innerHTML = `
      <div class="waiting">
        <section class="panel">
          <div class="label">Комната ${esc(code)}</div>
          <h1>Дело ещё готовится</h1>
          <p class="muted">
            Ведущий заполняет материалы.
            Когда он будет готов, он вручную запустит расследование.
          </p>
        </section>
      </div>
    `;
    return;
  }

  const caseData = publicData.case || {};
  const suspects = publicData.suspects || [];
  const revealedFacts = Object.values(publicData.facts || {});
  const detectivePrivate = room.detectivePrivate?.[me.uid] || {};
  const accusation = detectivePrivate.accusation;
  const active = publicData.activeInterrogation;

  $('app').innerHTML = `
    <main class="main">
      <div class="head">
        <div>
          <div class="label">Детектив · комната ${esc(code)}</div>
          <h1>${esc(caseData.title || 'Дело')}</h1>
          <p class="muted">${esc(caseData.intro || '')}</p>
        </div>

        <span class="role">Расследование</span>
      </div>

      <div class="grid2">
        <section class="card">
          <h3>Материалы дела</h3>

          <p><b>Жертва:</b> ${esc(caseData.victim || 'не указана')}</p>
          <p><b>Инцидент:</b> ${esc(caseData.incident || 'не указан')}</p>
          <p><b>Локация:</b> ${esc(caseData.location || 'не указана')}</p>

          <div class="sep"></div>

          <h3>Подозреваемые</h3>

          <div class="callgrid">
            ${suspects.length
              ? suspects.map(suspect => `
                  <button
                    class="call"
                    data-call-suspect="${esc(suspect.id)}"
                    ${active ? 'disabled' : ''}>
                    <b>${esc(suspect.name)}</b><br>
                    <span class="muted">
                      ${esc(suspect.profession || 'роль не указана')}
                    </span>
                    ${suspect.archetype
                      ? `<br><span class="muted small">${esc(suspect.archetype)}</span>`
                      : ''}
                  </button>
                `).join('')
              : '<p class="muted">Подозреваемые не добавлены.</p>'}
          </div>

          ${active
            ? `
              <div class="sep"></div>
              <div class="notice good">
                На допрос вызван:
                <strong>${esc(active.characterName)}</strong>
                <p class="small">
                  Веди разговор в Discord, а после завершения допроса дождись обновления экрана.
                </p>
              </div>
            `
            : ''}
        </section>

        <section class="card">
          <h3>Открытые факты</h3>

          ${revealedFacts.length
            ? revealedFacts.map(fact => `
                <p>• ${esc(fact)}</p>
              `).join('')
            : '<p class="muted">Ведущий ещё не раскрыл факты.</p>'}

          <div class="sep"></div>

          <h3>Личные заметки</h3>
          <textarea id="detectiveNotes" placeholder="Эти заметки видишь только ты">${esc(detectivePrivate.notes || '')}</textarea>

          <br>

          ${accusation
            ? `
              <div class="notice danger">
                Обвинение уже отправлено.
                Второго обвинения сделать нельзя.
              </div>
              <p><b>Подозреваемый:</b> ${esc(accusation.suspectName)}</p>
              <p><b>Обоснование:</b></p>
              <p class="muted">${esc(accusation.reason)}</p>
            `
            : `
              <button id="makeAccusation" class="btn danger">
                Сделать единственное обвинение
              </button>
            `}
        </section>
      </div>

      ${publicData.endingPublished
        ? `
          <br>
          <section class="card">
            <h3>Развязка</h3>
            <p class="muted">
              Ведущий открыл развязку. Обсудите её голосом в Discord.
            </p>
          </section>
        `
        : ''}
    </main>
  `;

  const notes = $('detectiveNotes');

  if (notes) {
    notes.oninput = () => {
      clearTimeout(notesTimer);

      notesTimer = setTimeout(async () => {
        await set(
          ref(db, `rooms/${code}/detectivePrivate/${me.uid}/notes`),
          notes.value
        );
      }, 500);
    };
  }

  document.querySelectorAll('[data-call-suspect]').forEach(button => {
    button.onclick = async () => {
      const suspectId = button.dataset.callSuspect;
      const suspect = suspects.find(item => item.id === suspectId);

      if (!suspect) return;

      await set(roomRef('public/activeInterrogation'), {
        characterId: suspect.id,
        characterName: suspect.name,
        detectiveUid: me.uid,
        startedAt: now()
      });

      toast(`${suspect.name} вызван на допрос.`);
    };
  });

  const makeAccusation = $('makeAccusation');

  if (makeAccusation) {
    makeAccusation.onclick = async () => {
      const suspectLines = suspects
        .map((suspect, index) => `${index + 1}. ${suspect.name}`)
        .join('\n');

      const selected = prompt(
        `Введи номер подозреваемого:\n\n${suspectLines}`
      );

      const index = Number(selected) - 1;
      const suspect = suspects[index];

      if (!suspect) {
        toast('Подозреваемый не выбран.');
        return;
      }

      const reason = prompt(
        'Опиши, почему ты считаешь этого персонажа убийцей:'
      );

      if (!reason?.trim()) {
        toast('Добавь обоснование обвинения.');
        return;
      }

      const currentSnapshot = await get(
        ref(db, `rooms/${code}/detectivePrivate/${me.uid}/accusation`)
      );

      if (currentSnapshot.exists()) {
        toast('Обвинение уже было отправлено.');
        return;
      }

      await set(
        ref(db, `rooms/${code}/detectivePrivate/${me.uid}/accusation`),
        {
          suspectId: suspect.id,
          suspectName: suspect.name,
          reason: reason.trim(),
          submittedAt: now()
        }
      );

      toast('Единственное обвинение отправлено ведущему.');
    };
  }
}

function playerRender() {
  const privateCard = room.playerPrivate?.[me.uid];
  const publicData = room.public || {};
  const participantData = participant();

  if (!privateCard) {
    $('app').innerHTML = `
      <div class="waiting">
        <section class="panel">
          <div class="label">Комната ${esc(code)}</div>
          <h1>Карточка готовится</h1>
          <p class="muted">
            Ведущий пока не назначил тебе персонажа.
            Оставайся в Discord и дождись назначения.
          </p>
        </section>
      </div>
    `;
    return;
  }

  const murdererInfo = privateCard.murdererInfo;

  $('app').innerHTML = `
    <main class="main">
      <div class="head">
        <div>
          <div class="label">Игрок-персонаж · комната ${esc(code)}</div>
          <h1>${esc(privateCard.name)}</h1>
          <p class="muted">
            Ты видишь только свою приватную карточку.
          </p>
        </div>

        <span class="role">
          ${publicData.status === 'investigation'
            ? 'Игра идёт'
            : 'Ожидание запуска'}
        </span>
      </div>

      <section class="card">
        <div class="grid2">
          <div>
            <div class="label">Профессия / роль</div>
            <p>${esc(privateCard.profession || 'не указана')}</p>
          </div>

          <div>
            <div class="label">Архетип</div>
            <p>${esc(privateCard.archetype || 'не указан')}</p>
          </div>
        </div>

        <div class="sep"></div>

        <div>
          <div class="label">Связи и отношения</div>
          <p>${esc(privateCard.relations || 'не указаны')}</p>
        </div>

        <div class="sep"></div>

        <div>
          <div class="label">Твой секрет</div>
          <p>${esc(privateCard.secret || 'Секрет не задан.')}</p>
        </div>

        <div class="sep"></div>

        <div>
          <div class="label">Личная цель</div>
          <p>${esc(privateCard.personalGoal || 'Цель не задана.')}</p>
        </div>

        ${murdererInfo
          ? `
            <div class="sep"></div>
            <div class="notice danger">
              <div class="label">Приватная информация убийцы</div>
              <p><b>Мотив:</b> ${esc(murdererInfo.motive)}</p>
              <p><b>Способ:</b> ${esc(murdererInfo.method)}</p>
              <p class="small">
                Не показывай эти данные детективу.
              </p>
            </div>
          `
          : ''}
      </section>

      <br>

      <section class="card">
        <h3>Правила твоей роли</h3>
        <p class="muted">
          Отыгрывай персонажа, отвечай на вопросы детектива в рамках своей карточки,
          можешь скрывать секреты и направлять разговор в нужную тебе сторону.
        </p>
      </section>
    </main>
  `;

  if (participantData?.characterId !== privateCard.characterId) {
    toast('Карточка обновлена ведущим.');
  }
}

async function startApplication() {
  try {
    await ensureAuth();
    $('status').textContent = 'Firebase подключён';
    landing();
  } catch (error) {
    $('status').textContent = 'Ошибка Firebase';
    toast(error.message);
  }
}

startApplication();
</script>
