    *{box-sizing:border-box;margin:0;padding:0}html{color-scheme:light dark;-webkit-text-size-adjust:100%}body{min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.55 Satoshi,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.48}textarea{resize:vertical;min-height:96px}h1,h2,h3{line-height:1.12}h1{font-family:Zodiak,Georgia,serif;font-size:clamp(2rem,4vw,3.4rem)}h2{font-size:1.22rem}p{max-width:72ch}a{color:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:100;background:var(--surface2);padding:10px;border-radius:8px}.shell{width:min(1180px,calc(100% - 32px));margin-inline:auto}.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid color-mix(in srgb,var(--text) 11%,transparent);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}.topbar-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.04em}.logo{width:34px;color:var(--primary)}main{padding:32px 0 64px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}.hero-copy{padding:24px 0}.hero-copy h1{margin:8px 0 14px}.eyebrow,.label{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}.muted{color:var(--muted)}.small{font-size:.88rem}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}.panel{background:var(--surface);border:1px solid color-mix(in srgb,var(--text) 11%,transparent);border-radius:18px;box-shadow:var(--shadow)}.pad{padding:22px}.grid{display:grid;gap:16px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.stack{display:grid;gap:12px}.section{margin-top:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card{padding:15px;background:var(--surface2);border:1px solid color-mix(in srgb,var(--text) 9%,transparent);border-radius:13px}.field{display:grid;gap:7px}.field>span{font-size:.8rem;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:11px;background:var(--surface2);padding:11px 12px}input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:2px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn,.icon-btn{min-height:44px;border-radius:11px;font-weight:750;transition:160ms ease}.btn{padding:0 15px;background:var(--offset)}.btn:hover{filter:brightness(1.04)}.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-hover)}[data-theme="dark"] .btn.primary{color:#10201c}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--border)}.icon-btn{width:44px;background:transparent;color:var(--muted)}.banner{padding:14px 15px;border-radius:12px;background:var(--primary-soft)}.banner.warning{background:var(--warning-soft)}.banner.danger{background:var(--danger-soft)}.banner.success{background:var(--success-soft)}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--offset);font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;align-items:center;gap:11px}.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.avatar{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);font-weight:800}.room-code{font-size:1.8rem;letter-spacing:.18em;font-weight:900}.secret-card{position:relative;overflow:hidden}.secret-card::after{content:"СЕКРЕТНО";position:absolute;right:-26px;top:22px;transform:rotate(35deg);font-size:.68rem;letter-spacing:.16em;font-weight:900;color:var(--danger);opacity:.42}.fact{display:grid;grid-template-columns:auto 1fr;gap:11px}.fact-num{font:800 1rem ui-monospace,monospace;color:var(--primary)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:13px}.toast-stack{position:fixed;right:16px;bottom:16px;z-index:100;display:grid;gap:8px}.toast{max-width:380px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);box-shadow:var(--shadow)}dialog{width:min(850px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:0;border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.58);backdrop-filter:blur(3px)}.modal-head,.modal-actions{position:sticky;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;background:var(--surface)}.modal-head{top:0;border-bottom:1px solid var(--border)}.modal-actions{bottom:0;border-top:1px solid var(--border)}.modal-body{padding:20px;overflow:auto}.character-editor{padding:16px;background:var(--surface2);border-radius:13px;border:1px solid var(--border)}.hidden{display:none!important}.loading{min-height:55vh;display:grid;place-items:center}.loading-mark{width:42px;height:42px;border:3px solid var(--offset);border-top-color:var(--primary);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.hero,.cols2,.cols3{grid-template-columns:1fr}.hero-copy{padding-top:4px}}@media(max-width:560px){.shell{width:min(100% - 20px,1180px)}main{padding-top:18px}.topbar-inner{min-height:60px}.brand span{font-size:.82rem}.pad{padding:16px}.actions>.btn{flex:1 1 auto}.spread.mobile-stack{align-items:stretch;flex-direction:column}.room-code{font-size:1.55rem}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const firebaseConfig={apiKey:'AIzaSyCxpowPqAwwtEVzxdyk1nVAzZ2HJKSJH1Q',authDomain:'delo-1b821.firebaseapp.com',databaseURL:'https://delo-1b821-default-rtdb.firebaseio.com',projectId:'delo-1b821',storageBucket:'delo-1b821.firebasestorage.app',messagingSenderId:'438900845008',appId:'1:438900845008:web:e308c6cf469f53593231d5'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=(v='')=>String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const makeCode=()=>Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const initials=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const clock=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
let me=null,screen='landing',roomCode='',meta=null,pub=null,members={},content=null,myCard=null,actions={},unsubs=[],actionUnsubs=[],actionMode='';
const roomPath=(part='')=>`rooms/${roomCode}${part?'/'+part:''}`;

const LOCATIONS=['Космический корабль «Персей»','Полярная станция','Горный отель','Старинная усадьба','Ночной поезд','Закрытый музей'];
function defaultCase(){return{title:'Тишина на «Персее»',intro:'После аварийной тревоги капитана находят мёртвым у отключённого терминала. На корабле нет посторонних, а журнал доступа кем-то очищен.',location:'Космический корабль «Персей»',victim:'Капитан Марк Левин',solution:{killerId:'c1',motive:'Месть за разрушенную карьеру',method:'Саботаж системы жизнеобеспечения'},facts:[{id:'f1',text:'В отсеке не было следов взлома.'},{id:'f2',text:'Служебный журнал очистили за 18 минут до тревоги.'},{id:'f3',text:'Один из подозреваемых солгал о своём маршруте.'},{id:'f4',text:'На перчатке жертвы найдено техническое масло.'}],characters:[{id:'c1',name:'Макс Орлов',archetype:'Холодный прагматик',motive:'Месть',secret:'Накануне угрожал капитану и тайно менял маршрут корабля.',objective:'Свести подозрения на Софию.',isKiller:true},{id:'c2',name:'Илья Ранев',archetype:'Измотанный профессионал',motive:'Карьерная выгода',secret:'Подделал старый отчёт и боится разоблачения.',objective:'Скрыть фальсификацию, но помочь найти убийцу.',isKiller:false},{id:'c3',name:'София Керн',archetype:'Очаровательный лжец',motive:'Ревность',secret:'Состояла с жертвой в тайной связи.',objective:'Не допустить огласки отношений.',isKiller:false}]};}
function publicFrom(c){return{title:c.title,intro:c.intro,location:c.location,victim:c.victim,characters:Object.fromEntries(c.characters.map(x=>[x.id,{id:x.id,name:x.name,archetype:x.archetype}])),revealedFacts:{},activeCall:null,status:'lobby',result:null,finalAccusation:null};}
function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;$('#toasts').append(el);setTimeout(()=>el.remove(),3400)}
function showError(err,prefix='Ошибка'){console.error(err);toast(`${prefix}: ${err?.message||err}`)}
function modal(html,bind){const m=$('#modal');m.innerHTML=html;m.showModal();$$('[data-close]',m).forEach(b=>b.onclick=()=>m.close());bind?.(m)}
function clearSubs(){unsubs.forEach(fn=>fn?.());actionUnsubs.forEach(fn=>fn?.());unsubs=[];actionUnsubs=[];actionMode=''}
function isHost(){return meta?.hostId===me?.uid}
function member(){return members?.[me?.uid]||null}
function orderedMembers(){return Object.values(members||{}).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0))}
function roleLabel(m){if(!m)return 'Не назначено';if(m.role==='host')return 'Ведущий';if(m.role==='detective')return 'Детектив';if(m.role==='character')return pub?.characters?.[m.characterId]?.name||'Персонаж';return 'Ожидает роль'}
function controller(characterId){const found=orderedMembers().find(m=>m.role==='character'&&m.characterId===characterId);return found?.name||meta?.hostName||'Ведущий'}
function logObj(text){return{text,at:Date.now(),label:`${clock()} ${text}`}}
function entries(obj){return Object.entries(obj||{}).sort((a,b)=>(b[1]?.at||0)-(a[1]?.at||0))}
function setHash(code=''){history.replaceState(null,'',code?`#${code}`:location.pathname+location.search)}

function landing(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Устный детектив для Discord</div><h1>Роли, допросы и одно финальное обвинение.</h1><p class="muted">Сайт ведёт партию, раздаёт приватные карточки и синхронизирует ход игры. Разговаривайте голосом — здесь остаётся только игровая механика.</p><div class="banner warning section small"><b>Перед первой игрой:</b> включи Anonymous Authentication и установи правила из файла <span class="mono">firebase-rules.json</span>.</div></div><div class="panel pad"><div class="grid cols2"><form id="createForm" class="grid"><h2>Создать комнату</h2><label class="field"><span>Имя ведущего</span><input name="name" maxlength="32" required placeholder="Дмитрий"></label><label class="field"><span>Игроков без ведущего</span><select name="max"><option>2</option><option>3</option><option selected>4</option></select></label><button class="btn primary">Создать комнату</button></form><form id="joinForm" class="grid"><h2>Войти по коду</h2><label class="field"><span>Имя игрока</span><input name="name" maxlength="32" required placeholder="Анна"></label><label class="field"><span>Код комнаты</span><input class="mono" name="code" maxlength="6" required placeholder="AB12CD" value="${esc(location.hash.slice(1).toUpperCase())}"></label><button class="btn">Войти</button></form></div></div></section>`}
function lobbyHost(){const guests=orderedMembers().filter(m=>m.role!=='host');return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Подготовка дела</div><h1>${esc(pub.title)}</h1><p class="muted">${esc(pub.intro)}</p><div class="actions section"><button class="btn primary" id="startBtn">Раздать роли и начать</button><button class="btn" id="autoBtn">Распределить автоматически</button><button class="btn ghost" id="editBtn">Редактировать дело</button></div></div><aside class="panel pad stack"><div><span class="label">Код комнаты</span><div class="room-code mono">${esc(roomCode)}</div></div><div class="banner"><b>Отправь друзьям:</b><br><span class="small mono">${esc(location.href)}</span></div><div class="spread"><span class="muted">Игроки</span><b>${guests.length} / ${meta.maxPlayers}</b></div></aside></section><section class="grid cols2 section"><article class="panel pad"><div class="section-head"><h2>Назначение ролей</h2><span class="tag">нужен детектив</span></div><div class="stack">${guests.length?guests.map(m=>playerAssignment(m)).join(''):'<div class="empty">Ждём игроков. Они входят по коду комнаты.</div>'}</div></article><article class="panel pad"><div class="section-head"><h2>Персонажи дела</h2></div><div class="stack">${Object.values(pub.characters||{}).map(c=>`<div class="card spread"><div><b>${esc(c.name)}</b><div class="small muted">${esc(c.archetype)}</div></div><span class="small">${esc(controller(c.id))}</span></div>`).join('')}</div></article></section>`}
function playerAssignment(m){const opts=[['pending','Ожидает роль'],['detective','Детектив'],...Object.values(pub.characters||{}).map(c=>[`character:${c.id}`,c.name])];const val=m.role==='character'?`character:${m.characterId}`:m.role;return `<div class="card spread mobile-stack"><div class="row"><div class="avatar">${esc(initials(m.name))}</div><div><b>${esc(m.name)}</b><div class="small muted">${esc(roleLabel(m))}</div></div></div><select class="roleSelect" data-uid="${esc(m.id)}" aria-label="Роль ${esc(m.name)}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}
function hostGame(){const accusation=latestAccusation();return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Расследование идёт</div><h1>${esc(pub.title)}</h1><p class="muted">${esc(pub.intro)}</p><div class="actions section"><button class="btn primary" id="factBtn">Открыть факт</button><button class="btn" id="callBtn">Вызвать на допрос</button><button class="btn ghost" id="endCallBtn" ${pub.activeCall?'':'disabled'}>Завершить допрос</button><button class="btn danger" id="resolveBtn" ${accusation?'':'disabled'}>Объявить решение</button></div>${pub.result?resultBanner():''}</div><aside class="panel pad stack"><div><span class="label">Комната</span><div class="room-code mono">${esc(roomCode)}</div></div><div class="card"><b>Сейчас на допросе:</b><p>${pub.activeCall?esc(pub.characters[pub.activeCall]?.name||'Персонаж'):'никого'}</p></div><div class="card"><b>Локация:</b><p>${esc(pub.location)}</p></div></aside></section><section class="grid cols3 section"><article class="panel pad"><div class="section-head"><h2>Игроки</h2></div><div class="stack">${orderedMembers().map(m=>`<div class="card row"><div class="avatar">${esc(initials(m.name))}</div><div><b>${esc(m.name)}</b><div class="small muted">${esc(roleLabel(m))}${actions?.bans?.[m.id]?' · отказ использован':''}</div></div></div>`).join('')}</div></article><article class="panel pad"><div class="section-head"><h2>Открытые факты</h2></div>${revealedFactsHtml()}</article><article class="panel pad"><div class="section-head"><h2>Обвинение</h2></div>${accusation?`<div class="card"><b>${esc(pub.characters[accusation.killerId]?.name||'—')}</b><p><b>Мотив:</b> ${esc(accusation.motive)}</p><p><b>Способ:</b> ${esc(accusation.method)}</p><p class="small muted">${esc(accusation.evidence)}</p></div>`:'<div class="empty">Детектив ещё не выдвинул обвинение.</div>'}</article></section><section class="grid cols2 section"><article class="panel pad"><div class="section-head"><h2>Тайна дела</h2><span class="tag">только ведущий</span></div><div class="card secret-card"><b>Убийца: ${esc(content.characters.find(c=>c.id===content.solution.killerId)?.name||'—')}</b><p>Мотив: ${esc(content.solution.motive)}</p><p>Способ: ${esc(content.solution.method)}</p></div></article><article class="panel pad"><div class="section-head"><h2>Журнал</h2></div><div class="stack small">${entries(actions?.logs).slice(0,12).map(([,x])=>`<div class="card">${esc(x.label||x.text)}</div>`).join('')||'<div class="empty">Пока пусто.</div>'}</div></article></section>`}
function guestLobby(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Комната ${esc(roomCode)}</div><h1>Ждём начала партии</h1><p class="muted">Ведущий готовит дело и назначает роли. Не закрывай вкладку — после старта здесь появится твоя приватная карточка.</p></div><aside class="panel pad stack"><div class="row"><div class="avatar">${esc(initials(member()?.name))}</div><div><b>${esc(member()?.name||'Игрок')}</b><div class="muted">${esc(roleLabel(member()))}</div></div></div><div class="banner">Общайтесь в Discord. Сайт нужен только для ролей и хода партии.</div></aside></section><section class="panel pad section"><div class="section-head"><h2>Кто уже в комнате</h2></div><div class="grid cols3">${orderedMembers().map(m=>`<div class="card"><b>${esc(m.name)}</b><div class="small muted">${m.role==='host'?'Ведущий':'Игрок'}</div></div>`).join('')}</div></section>`}
function guestGame(){const detective=myCard?.type==='detective',called=!detective&&pub.activeCall===myCard?.characterId,banned=!!actions?.bans?.[me.uid];return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${detective?'Детектив':'Приватная роль'}</div><h1>${esc(myCard?.name||'Роль загружается')}</h1><p class="muted">${detective?'Допрашивай персонажей голосом, фиксируй противоречия и выдвини одно окончательное обвинение.':'Играй персонажа устно. Можно скрывать секрет, но нельзя менять факты карточки.'}</p>${called?'<div class="banner warning section"><b>Тебя вызвали на допрос.</b> Перейди в голосовой канал и отвечай детективу.</div>':''}${pub.result?resultBanner():''}</div><aside class="panel pad stack secret-card"><div><span class="label">Роль</span><p><b>${esc(myCard?.roleLabel||'—')}</b></p></div><div><span class="label">Архетип</span><p><b>${esc(myCard?.archetype||'—')}</b></p></div>${detective?'':`<div><span class="label">Твой мотив</span><p>${esc(myCard?.motive||'—')}</p></div><div><span class="label">Твой секрет</span><p>${esc(myCard?.secret||'—')}</p></div><div><span class="label">Личная цель</span><p>${esc(myCard?.objective||'—')}</p></div>`}</aside></section><section class="grid cols2 section"><article class="panel pad"><div class="section-head"><h2>Ход игры</h2></div><div class="stack"><div class="card"><b>Жертва:</b> ${esc(pub.victim)}</div><div class="card"><b>Локация:</b> ${esc(pub.location)}</div><div class="card"><b>На допросе:</b> ${pub.activeCall?esc(pub.characters[pub.activeCall]?.name||'—'):'никого'}</div>${detective?`<button class="btn danger" id="accuseBtn" ${pub.finalAccusation?'disabled':''}>${pub.finalAccusation?'Обвинение отправлено':'Финальное обвинение'}</button>`:`<button class="btn danger" id="banBtn" ${banned?'disabled':''}>${banned?'Отказ уже использован':'Один раз отказаться отвечать'}</button>`}</div></article><article class="panel pad"><div class="section-head"><h2>Открытые факты</h2></div>${revealedFactsHtml()}${detective?`<label class="field section"><span>Личные заметки (только в этой вкладке)</span><textarea id="notes" placeholder="Подозрения, алиби, противоречия..."></textarea></label>`:''}</article></section><section class="panel pad section"><div class="section-head"><h2>Кого можно допросить</h2></div><div class="grid cols3">${Object.values(pub.characters||{}).map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="small muted">${esc(c.archetype)} · играет ${esc(controller(c.id))}</div></div>`).join('')}</div></section>`}
function revealedFactsHtml(){const list=Object.values(pub?.revealedFacts||{});return list.length?`<div class="stack">${list.map((f,i)=>`<div class="card fact"><span class="fact-num">${String(i+1).padStart(2,'0')}</span><p>${esc(f.text||f)}</p></div>`).join('')}</div>`:'<div class="empty">Пока ни одного факта не открыто.</div>'}
function resultBanner(){return `<div class="banner ${pub.result.correct?'success':'danger'} section"><b>${pub.result.correct?'Дело раскрыто':'Дело не раскрыто'}</b><p>${esc(pub.result.text)}</p><p class="small">Настоящий мотив: ${esc(pub.result.motive)}. Способ: ${esc(pub.result.method)}.</p></div>`}
function latestAccusation(){return entries(actions?.accusations)[0]?.[1]||null}
function render(){const root=$('#main');if(screen==='loading'){root.innerHTML='<div class="loading"><div class="loading-mark"></div></div>';return}if(screen==='landing'||!meta){root.innerHTML=landing();bindLanding();return}if(isHost())root.innerHTML=pub?.status==='investigation'||pub?.status==='finished'?hostGame():lobbyHost();else root.innerHTML=pub?.status==='investigation'||pub?.status==='finished'?guestGame():guestLobby();bindRoom()}
function bindLanding(){$('#createForm').onsubmit=e=>{e.preventDefault();createRoom(new FormData(e.currentTarget))};$('#joinForm').onsubmit=e=>{e.preventDefault();joinRoom(new FormData(e.currentTarget))}}
function bindRoom(){if(isHost()){$$('#main .roleSelect').forEach(s=>s.onchange=()=>assignRole(s.dataset.uid,s.value));$('#autoBtn')?.addEventListener('click',autoAssign);$('#editBtn')?.addEventListener('click',openEditor);$('#startBtn')?.addEventListener('click',startGame);$('#factBtn')?.addEventListener('click',openFact);$('#callBtn')?.addEventListener('click',openCall);$('#endCallBtn')?.addEventListener('click',()=>hostUpdate({'public/activeCall':null,[`actions/logs/${Date.now()}`]:logObj('Допрос завершён')}));$('#resolveBtn')?.addEventListener('click',resolveGame)}else{$('#banBtn')?.addEventListener('click',useBan);$('#accuseBtn')?.addEventListener('click',openAccusation)}}

async function createRoom(fd){try{const name=String(fd.get('name')).trim(),maxPlayers=Number(fd.get('max'));let candidate='';for(let i=0;i<8;i++){candidate=makeCode();if(!(await get(ref(db,`rooms/${candidate}/meta`))).exists())break}roomCode=candidate;const c=defaultCase();const data={meta:{hostId:me.uid,hostName:name,maxPlayers,status:'lobby',createdAt:serverTimestamp()},public:publicFrom(c),content:c,members:{[me.uid]:{id:me.uid,name,role:'host',joinedAt:Date.now()}},actions:{logs:{[Date.now()]:logObj('Комната создана')}}};await set(ref(db,roomPath()),data);setHash(roomCode);subscribeRoom()}catch(e){showError(e,'Не удалось создать комнату')}}
async function joinRoom(fd){try{const code=String(fd.get('code')).trim().toUpperCase(),name=String(fd.get('name')).trim();const snap=await get(ref(db,`rooms/${code}/meta`));if(!snap.exists())return toast('Комната не найдена.');const m=snap.val();if(m.status!=='lobby')return toast('Партия уже началась.');roomCode=code;const countSnap=await get(ref(db,`rooms/${code}/members`));const guestCount=Object.values(countSnap.val()||{}).filter(x=>x.role!=='host').length;if(guestCount>=m.maxPlayers)return toast('Комната заполнена.');await set(ref(db,`${roomPath('members')}/${me.uid}`),{id:me.uid,name,role:'pending',joinedAt:Date.now()});setHash(roomCode);subscribeRoom()}catch(e){showError(e,'Не удалось войти')}}
function setupActionSubscriptions(base){const mode=meta?.hostId===me.uid?'host':'guest';if(actionMode===mode)return;actionUnsubs.forEach(fn=>fn?.());actionUnsubs=[];actionMode=mode;actions={};if(mode==='host'){actionUnsubs.push(onValue(ref(db,`${base}/actions`),s=>{actions=s.val()||{};render()}))}else{actionUnsubs.push(onValue(ref(db,`${base}/actions/bans`),s=>{actions.bans=s.val()||{};render()}));actionUnsubs.push(onValue(ref(db,`${base}/actions/accusations/${me.uid}`),s=>{actions.accusations=s.exists()?{[me.uid]:s.val()}:{};render()}))}}
function subscribeRoom(){clearSubs();screen='loading';render();const base=`rooms/${roomCode}`;unsubs.push(onValue(ref(db,`${base}/meta`),s=>{meta=s.val();if(!meta){leaveToLanding('Комната больше не существует.');return}setupActionSubscriptions(base);render()},e=>{leaveToLanding('Нет доступа к комнате. Войди по коду заново.')}));unsubs.push(onValue(ref(db,`${base}/public`),s=>{pub=s.val();render()},e=>showError(e,'Нет доступа к общей части комнаты')));unsubs.push(onValue(ref(db,`${base}/members`),s=>{members=s.val()||{};render()},e=>showError(e,'Не удалось загрузить игроков')));unsubs.push(onValue(ref(db,`${base}/cards/${me.uid}`),s=>{myCard=s.val();render()},()=>{}));get(ref(db,`${base}/content`)).then(s=>{content=s.val();screen='room';render()}).catch(()=>{content=null;screen='room';render()})}
function leaveToLanding(message=''){clearSubs();roomCode='';meta=pub=content=myCard=null;members={};actions={};screen='landing';setHash('');render();if(message)toast(message)}
async function hostUpdate(paths){try{await update(ref(db,roomPath()),paths)}catch(e){showError(e,'Не удалось обновить игру')}}
async function assignRole(uid,value){const next=clone(members);if(value==='detective')Object.values(next).forEach(m=>{if(m.role==='detective'){m.role='pending';delete m.characterId}});if(value.startsWith('character:')){const cid=value.split(':')[1];Object.values(next).forEach(m=>{if(m.characterId===cid){m.role='pending';delete m.characterId}});next[uid].role='character';next[uid].characterId=cid}else{next[uid].role=value;delete next[uid].characterId}await hostUpdate({members:next})}
async function autoAssign(){const guests=orderedMembers().filter(m=>m.role!=='host');if(!guests.length)return toast('Сначала должны войти игроки.');const next=clone(members);guests.forEach(m=>{next[m.id].role='pending';delete next[m.id].characterId});next[guests[0].id].role='detective';const ids=content.characters.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const killer=content.solution.killerId;if(guests.length>1&&!ids.slice(0,guests.length-1).includes(killer)){ids.splice(ids.indexOf(killer),1);ids.unshift(killer)}guests.slice(1).forEach((m,i)=>{if(ids[i]){next[m.id].role='character';next[m.id].characterId=ids[i]}});await hostUpdate({members:next,[`actions/logs/${Date.now()}`]:logObj('Роли распределены')})}
function validateStart(){const guests=orderedMembers().filter(m=>m.role!=='host');if(!guests.length)return 'Нужен хотя бы один игрок.';if(!guests.some(m=>m.role==='detective'))return 'Назначь одного детектива.';if(guests.some(m=>m.role==='pending'))return 'Назначь роль каждому вошедшему игроку.';return ''}
async function startGame(){const err=validateStart();if(err)return toast(err);const paths={'meta/status':'investigation','public/status':'investigation',[`actions/logs/${Date.now()}`]:logObj('Расследование началось')};orderedMembers().filter(m=>m.role!=='host').forEach(m=>{if(m.role==='detective')paths[`cards/${m.id}`]={type:'detective',name:'Детектив',roleLabel:'Детектив',archetype:'Следователь'};else{const c=content.characters.find(x=>x.id===m.characterId);paths[`cards/${m.id}`]={type:'character',characterId:c.id,name:c.name,roleLabel:c.isKiller?'Убийца':'Подозреваемый',archetype:c.archetype,motive:c.motive,secret:c.secret,objective:c.objective,isKiller:c.isKiller}}});await hostUpdate(paths)}
function openEditor(){const c=content;modal(`<form id="caseForm"><div class="modal-head"><h2>Редактор дела</h2><button type="button" class="icon-btn" data-close>✕</button></div><div class="modal-body grid"><div class="grid cols2"><label class="field"><span>Название</span><input name="title" value="${esc(c.title)}" required></label><label class="field"><span>Локация</span><input name="location" list="locations" value="${esc(c.location)}" required><datalist id="locations">${LOCATIONS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label></div><label class="field"><span>Вводная</span><textarea name="intro" required>${esc(c.intro)}</textarea></label><label class="field"><span>Жертва</span><input name="victim" value="${esc(c.victim)}" required></label><h2>Персонажи</h2>${c.characters.map((x,i)=>`<div class="character-editor grid"><input type="hidden" name="c${i}id" value="${esc(x.id)}"><div class="grid cols2"><label class="field"><span>Имя</span><input name="c${i}name" value="${esc(x.name)}" required></label><label class="field"><span>Архетип</span><input name="c${i}arch" value="${esc(x.archetype)}" required></label></div><div class="grid cols2"><label class="field"><span>Личный мотив</span><input name="c${i}motive" value="${esc(x.motive)}" required></label><label class="field"><span>Личная цель</span><input name="c${i}objective" value="${esc(x.objective)}" required></label></div><label class="field"><span>Секрет</span><textarea name="c${i}secret" required>${esc(x.secret)}</textarea></label></div>`).join('')}<h2>Истинное решение</h2><div class="grid cols3"><label class="field"><span>Убийца</span><select name="killerId">${c.characters.map(x=>`<option value="${x.id}" ${x.id===c.solution.killerId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>Мотив убийства</span><input name="solutionMotive" value="${esc(c.solution.motive)}" required></label><label class="field"><span>Способ</span><input name="solutionMethod" value="${esc(c.solution.method)}" required></label></div><h2>Проверяемые факты</h2>${c.facts.map((f,i)=>`<label class="field"><span>Факт ${i+1}</span><input name="fact${i}" value="${esc(f.text)}" required></label>`).join('')}</div><div class="modal-actions"><button type="button" class="btn" data-close>Отмена</button><button class="btn primary">Сохранить дело</button></div></form>`,m=>{$('#caseForm',m).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),next=clone(content);next.title=fd.get('title');next.location=fd.get('location');next.intro=fd.get('intro');next.victim=fd.get('victim');next.characters=next.characters.map((x,i)=>({...x,name:fd.get(`c${i}name`),archetype:fd.get(`c${i}arch`),motive:fd.get(`c${i}motive`),objective:fd.get(`c${i}objective`),secret:fd.get(`c${i}secret`),isKiller:x.id===fd.get('killerId')}));next.solution={killerId:fd.get('killerId'),motive:fd.get('solutionMotive'),method:fd.get('solutionMethod')};next.facts=next.facts.map((x,i)=>({...x,text:fd.get(`fact${i}`)}));content=next;await hostUpdate({content:next,public:publicFrom(next)});m.close();toast('Дело сохранено.')}})}
function openFact(){const available=content.facts.filter(f=>!pub.revealedFacts?.[f.id]);if(!available.length)return toast('Все факты уже открыты.');modal(`<form id="factForm"><div class="modal-head"><h2>Открыть факт</h2><button type="button" class="icon-btn" data-close>✕</button></div><div class="modal-body"><label class="field"><span>Факт</span><select name="id">${available.map(f=>`<option value="${f.id}">${esc(f.text)}</option>`).join('')}</select></label></div><div class="modal-actions"><button class="btn primary">Открыть всем</button></div></form>`,m=>{$('#factForm',m).onsubmit=async e=>{e.preventDefault();const id=new FormData(e.currentTarget).get('id'),f=content.facts.find(x=>x.id===id);await hostUpdate({[`public/revealedFacts/${id}`]:f,[`actions/logs/${Date.now()}`]:logObj(`Открыт факт: ${f.text}`)});m.close()}})}
function openCall(){modal(`<form id="callForm"><div class="modal-head"><h2>Вызвать на допрос</h2><button type="button" class="icon-btn" data-close>✕</button></div><div class="modal-body"><label class="field"><span>Персонаж</span><select name="id">${Object.values(pub.characters).map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(controller(c.id))}</option>`).join('')}</select></label></div><div class="modal-actions"><button class="btn primary">Вызвать</button></div></form>`,m=>{$('#callForm',m).onsubmit=async e=>{e.preventDefault();const id=new FormData(e.currentTarget).get('id');await hostUpdate({'public/activeCall':id,[`actions/logs/${Date.now()}`]:logObj(`На допрос вызван ${pub.characters[id].name}`)});m.close()}})}
async function useBan(){try{await set(ref(db,roomPath(`actions/bans/${me.uid}`)),{used:true,at:Date.now(),name:member().name});toast('Отказ отмечен. Сообщи об этом голосом.')}catch(e){showError(e,'Не удалось использовать отказ')}}
function openAccusation(){modal(`<form id="accForm"><div class="modal-head"><h2>Финальное обвинение</h2><button type="button" class="icon-btn" data-close>✕</button></div><div class="modal-body grid"><div class="banner danger"><b>Это окончательное решение.</b> После отправки изменить его нельзя.</div><label class="field"><span>Кого обвиняешь</span><select name="killerId">${Object.values(pub.characters).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label class="field"><span>Мотив</span><textarea name="motive" required></textarea></label><label class="field"><span>Способ убийства</span><textarea name="method" required></textarea></label><label class="field"><span>Главные доказательства</span><textarea name="evidence" required></textarea></label></div><div class="modal-actions"><button class="btn danger">Отправить обвинение</button></div></form>`,m=>{$('#accForm',m).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),path=roomPath(`actions/accusations/${me.uid}`),exists=await get(ref(db,path));if(exists.exists())return toast('Обвинение уже отправлено.');await set(ref(db,path),{killerId:fd.get('killerId'),motive:fd.get('motive'),method:fd.get('method'),evidence:fd.get('evidence'),by:me.uid,at:Date.now()});m.close();toast('Обвинение отправлено ведущему.')}})}
async function resolveGame(){const a=latestAccusation();if(!a)return toast('Обвинения пока нет.');const killer=content.characters.find(c=>c.id===content.solution.killerId),accused=content.characters.find(c=>c.id===a.killerId),correct=a.killerId===content.solution.killerId;await hostUpdate({'meta/status':'finished','public/status':'finished','public/finalAccusation':a,'public/result':{correct,text:correct?`Детектив верно назвал убийцу: ${killer.name}.`:`Обвинён ${accused?.name||'неизвестный персонаж'}, но настоящий убийца — ${killer.name}.`,killerId:killer.id,motive:content.solution.motive,method:content.solution.method},[`actions/logs/${Date.now()}`]:logObj(correct?'Дело раскрыто':'Дело не раскрыто')})}

$('#themeBtn').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
$('#homeBtn').onclick=()=>leaveToLanding();
window.addEventListener('error',e=>{console.error(e.error||e.message)});
onAuthStateChanged(auth,user=>{if(user){me=user;screen='landing';render()}else signInAnonymously(auth).catch(e=>{screen='landing';render();showError(e,'Firebase Authentication не запущен')})});
</script>
</body>
